<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shri Guru Sharan Sewa Trust</title>
  <script>
    // GitHub Pages SPA redirect: store the path and redirect to index.html
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=/' + l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
